# trivy ignore file for `make scan` (trivy config). Every ignore needs a
# statement that says why the finding is acceptable (CONVENTIONS.md
# section 15), and paths so it cannot hide the same finding elsewhere:
#
# misconfigurations:
#   - id: <check id>
#     paths:
#       - <file>.tf
#     statement: >-
#       Why this is acceptable, in one or two sentences.

misconfigurations:
  - id: AZU-0068
    paths:
      - node_network_interface.tf
    statement: >-
      The NIC is associated with its role's network security group by
      azurerm_network_interface_security_group_association in
      machine/node_security_group_association.tf, before the VM boots; the
      group comes from the cluster's exports, which trivy cannot follow.
